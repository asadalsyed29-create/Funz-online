<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Funz Online</title>
<meta name="description" content="Funz Online: one big peaceful world to explore, build and hang out in.">
<meta name="theme-color" content="#0f1830">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Funz Online">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="game"></canvas>

<div id="menu" class="screen">
  <div class="panel">
    <img src="icons/icon-192.png" alt="" class="logo">
    <h1>Funz Online</h1>
    <p class="sub">One big peaceful world. Explore, build and hang out with everyone.</p>
    <div id="deviceBadge" class="badge"></div>

    <canvas id="avatarPreview" width="160" height="120"></canvas>
    <label>Your name
      <input id="nameInput" maxlength="16" placeholder="Your name" autocomplete="off">
    </label>
    <div class="pickLabel">Color</div>
    <div class="colors" id="colors"></div>
    <div class="pickLabel">Hat</div>
    <div class="hats" id="hats"></div>

    <button id="playBtn" class="big">Play</button>
    <button id="installBtn" class="ghost hidden">Install Funz Online</button>
    <p id="iosHint" class="hint hidden">To install on iPhone or iPad: tap Share, then "Add to Home Screen".</p>
    <p id="menuMsg" class="msg"></p>
    <p class="ver">Version 1.2</p>
  </div>
</div>

<div id="hud" class="hidden">
  <div id="topLeft">
    <div id="roomBox"><span id="roomLabel"></span><button id="leaveBtn" class="mini leave">Leave</button><button id="adminBtn" class="mini hidden">★ Admin</button></div>
    <div id="people"></div>
  </div>
  <div id="clock"><span id="clockIc"></span><span id="clockT"></span></div>
  <div id="adminPanel" class="hidden"></div>
  <div id="toast" class="hidden"></div>
  <div id="bottom">
    <div id="emotes"></div>
    <div id="hotbar"></div>
  </div>
  <button id="buildToggle" class="hidden">Build</button>
</div>

<div id="chat" class="hidden">
  <div id="chatLog"></div>
  <form id="chatForm" autocomplete="off">
    <input id="chatInput" maxlength="120" placeholder="Chat… (Enter)">
    <button type="submit" class="mini">Send</button>
  </form>
</div>
<button id="chatToggle" class="hidden"></button>

<div id="touch" class="hidden">
  <div id="stick"><div id="knob"></div></div>
</div>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="js/icons.js"></script>
<script src="js/device.js"></script>
<script src="js/world.js"></script>
<script src="js/render.js"></script>
<script src="js/net.js"></script>
<script src="js/app.js"></script>
</body>
</html>
